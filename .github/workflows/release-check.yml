name: release-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: eval/requirements-test.txt
      - name: Install CPU test dependencies
        run: python -m pip install -r eval/requirements-test.txt
      - name: Verify release integrity
        run: python -B verify_release.py
      - name: Check shell syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Run evaluation unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: eval
        run: python -B -m unittest discover -s eval/tests -v
