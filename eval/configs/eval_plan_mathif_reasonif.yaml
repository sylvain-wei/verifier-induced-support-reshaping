  - {model: math_rlvr,    benchmark: mathif,   mode: sampling_k4, k: 4, temperature: 0.7, top_p: 0.95}
  - {model: if_rlvr,      benchmark: mathif,   mode: sampling_k4, k: 4, temperature: 0.7, top_p: 0.95}
  - {model: math_then_if, benchmark: mathif,   mode: sampling_k4, k: 4, temperature: 0.7, top_p: 0.95}
  - {model: if_then_math, benchmark: mathif,   mode: sampling_k4, k: 4, temperature: 0.7, top_p: 0.95}

  - {model: base,         benchmark: reasonif, mode: sampling_k4, k: 4, temperature: 0.7, top_p: 0.95}
  - {model: math_rlvr,    benchmark: reasonif, mode: sampling_k4, k: 4, temperature: 0.7, top_p: 0.95}
  - {model: if_rlvr,      benchmark: reasonif, mode: sampling_k4, k: 4, temperature: 0.7, top_p: 0.95}
  - {model: math_then_if, benchmark: reasonif, mode: sampling_k4, k: 4, temperature: 0.7, top_p: 0.95}
