global:
  seed: 42
  max_new_tokens: 4096
  flush_every: 16
  vllm:
    dtype: bfloat16
    gpu_memory_utilization: 0.88
    max_model_len: 8192
    trust_remote_code: false
    enforce_eager: false

models_today: [base, math_rlvr, if_rlvr, math_then_if, if_then_math]

required:
